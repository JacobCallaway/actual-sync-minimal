{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: actual-sync
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  # The dashboard and the CronJob share one ReadWriteOnce volume, so the old
  # pod must release it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: actual-sync
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actual-sync
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: {{ .Release.Name }}-sa
      containers:
      - name: dashboard
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/app/actual-sync"]
        args: ["server", "--port", "{{ .Values.dashboard.port }}"]
        ports:
        - name: http
          containerPort: {{ .Values.dashboard.port }}
        env:
        - name: CONFIG_FILE_PATH
          value: "/config/.config.yml"
        - name: STATE_DIR
          value: {{ .Values.persistence.mountPath | quote }}
        - name: DASHBOARD_DATA_DIR
          value: {{ .Values.persistence.mountPath | quote }}
        - name: ACTUAL_SYNC_CRONJOB_NAME
          value: {{ .Release.Name | quote }}
        - name: TZ
          value: {{ .Values.cronjob.timeZone | quote }}
        {{- if .Values.dashboard.existingSecret }}
        # Anyone who reaches the dashboard can move money mappings and start
        # bank authorisations, so gate it whenever it is not localhost-only.
        - name: DASHBOARD_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.dashboard.existingSecret }}
              key: {{ .Values.dashboard.existingSecretKey }}
        {{- end }}
        readinessProbe:
          httpGet:
            path: /api/status
            port: http
            {{- if .Values.dashboard.existingSecret }}
            httpHeaders:
            - name: Accept
              value: application/json
            {{- end }}
          initialDelaySeconds: 5
          periodSeconds: 15
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: data
          mountPath: {{ .Values.persistence.mountPath }}
        resources:
          requests:
            memory: {{ .Values.dashboard.resources.requests.memory | quote }}
            cpu: {{ .Values.dashboard.resources.requests.cpu | quote }}
          limits:
            memory: {{ .Values.dashboard.resources.limits.memory | quote }}
            cpu: {{ .Values.dashboard.resources.limits.cpu | quote }}
      volumes:
      - name: config
        configMap:
          {{- if .Values.existingConfigMap }}
          name: {{ .Values.existingConfigMap }}
          {{- else }}
          name: {{ .Release.Name }}-config
          {{- end }}
          defaultMode: 0644
      - name: data
        {{- if .Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
        {{- else }}
        emptyDir: {}
        {{- end }}
{{- end }}
